<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte per duellante — Legacy of the Duelist: Link Evolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14121c; --panel:#1d1a29; --panel2:#272235; --line:#393350;
    --gold:#c9a24a; --gold-dim:#7d6a35; --text:#ece7dc; --muted:#9b93ad;
    --teal:#63c6c0; --r:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
  h1,h2,h3,.nome{font-family:Spectral,Georgia,serif;font-weight:600}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input{font:inherit}
  .wrap{max-width:900px;margin:0 auto;padding:0 14px 40px}

  .top{position:sticky;top:0;z-index:20;background:rgba(20,18,28,.95);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top-in{max-width:900px;margin:0 auto;padding:10px 14px;display:flex;gap:10px;align-items:center}
  .titolo{font-size:16px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .indietro{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;flex:none;
    display:grid;place-items:center;color:var(--gold);font-size:20px;line-height:1}
  .conta{font-size:12px;color:var(--muted);flex:none}

  .cerca{width:100%;padding:11px 13px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);color:var(--text);outline:none;margin:14px 0 10px}
  .cerca:focus{border-color:var(--gold-dim)}
  .cerca::placeholder{color:var(--muted)}
  .tabs{display:flex;gap:6px;margin:14px 0 0}
  .tab{flex:1;padding:9px 8px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:14px}
  .tab[aria-selected="true"]{color:#1a1626;background:var(--gold);border-color:var(--gold);font-weight:600}

  .serie{font-size:12.5px;color:var(--muted);margin:18px 0 7px;letter-spacing:.3px}
  .duellanti{display:grid;gap:8px}
  .duel{display:flex;gap:12px;align-items:center;padding:8px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r);width:100%;text-align:left}
  .duel:active{background:var(--panel2)}
  .ritratto{width:54px;height:54px;border-radius:8px;flex:none;object-fit:cover;object-position:center top;
    background:var(--panel2);border:1px solid var(--gold-dim)}
  .iniziali{display:grid;place-items:center;font-family:Spectral,serif;font-size:19px;color:var(--gold)}
  .duel .nome{font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .duel small{color:var(--muted);font-size:12.5px}

  .filtri{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
  .f{flex:none;padding:6px 11px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--muted);
    display:flex;align-items:center;gap:6px;white-space:nowrap}
  .f[aria-pressed="true"]{color:var(--text);border-color:var(--gold);background:var(--panel2)}
  .pallino{width:9px;height:9px;border-radius:2px;display:inline-block}

  .carte{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  @media(min-width:560px){.carte{grid-template-columns:repeat(4,1fr)}}
  @media(min-width:760px){.carte{grid-template-columns:repeat(5,1fr)}}
  .carta{contain:content;text-align:left;position:relative}
  .carta img,.carta .vuota{width:100%;aspect-ratio:59/86;border-radius:5px;display:block;background:var(--panel2)}
  .carta .vuota{border:1px dashed var(--line);display:grid;place-items:center;padding:6px;
    font-size:10.5px;color:var(--muted);text-align:center;overflow:hidden}
  .carta span.n{display:-webkit-box;font-size:11.5px;line-height:1.3;margin-top:5px;color:var(--muted);
    overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;border-left:3px solid transparent;padding-left:5px}
  .rara{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 0 2px rgba(20,18,28,.85)}

  .testa{display:flex;gap:14px;align-items:center;padding:14px 0 2px}
  .testa .ritratto{width:82px;height:82px}
  .testa h2{margin:0;font-size:21px}
  .testa p{margin:3px 0 0;color:var(--muted);font-size:13px}

  .ris{display:flex;gap:11px;padding:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);margin-bottom:8px;width:100%;text-align:left;align-items:flex-start}
  .ris img,.ris .vuota{width:50px;flex:none;aspect-ratio:59/86;border-radius:4px;background:var(--panel2)}
  .ris .nome{font-size:15px}
  .chip{display:inline-block;padding:2px 8px;margin:5px 5px 0 0;border:1px solid var(--gold-dim);
    border-radius:99px;font-size:11.5px;color:var(--gold)}

  .velo{position:fixed;inset:0;z-index:40;background:rgba(10,8,16,.9);display:grid;place-items:center;padding:20px}
  .scheda{max-width:320px;width:100%;text-align:center}
  .scheda img{width:100%;border-radius:8px}
  .scheda h3{margin:12px 0 4px;font-size:18px}
  .scheda .meta{color:var(--muted);font-size:13px}
  .chiudi{margin-top:14px;padding:9px 22px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}

  .boot{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
    max-width:560px;margin:0 auto;padding:28px 20px}
  .boot h1{font-size:26px;margin:0 0 6px;line-height:1.2}
  .boot .sub{color:var(--muted);margin:0 0 20px;font-size:14px}
  .barra{height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin:6px 0 18px}
  .barra i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
  .azione{display:block;width:100%;padding:12px;background:var(--gold);color:#1a1626;border-radius:var(--r);
    font-weight:600;margin-top:10px;text-align:center}
  .azione.second{background:none;border:1px solid var(--line);color:var(--text);font-weight:500}
  .vuoto{color:var(--muted);text-align:center;padding:36px 10px;font-size:14px}
  .caricando{color:var(--muted);font-size:13px;padding:10px 0}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ============ buste del Card Shop, per serie ============ */
const SERIE = [
  ["Duel Monsters", ["Grandpa Muto", "Mai Valentine", "Bakura", "Joey Wheeler", "Seto Kaiba", "Yugi"]],
  ["GX", ["Alexis Rhodes", "Bastion Misawa", "Chazz Princeton", "Syrus Truesdale", "Jesse Anderson", "Jaden Yuki"]],
  ["5D's", ["Tetsu Trudge", "Leo/Luna", "Akiza Izinski", "Jack Atlas", "Crow", "Yusei Fudo"]],
  ["ZEXAL", ["Cathy Katherine", "Quinton", "Kite Tenjo", "Shark", "Yuma Tsukumo"]],
  ["ARC-V", ["Gong Strong", "Zuzu Boyle", "Shay", "Declan Akaba", "Yuya Sakaki"]],
  ["VRAINS", ["Playmaker", "Blue Angel", "Soulburner", "Varis", "Ai"]]
];
const NOMI = SERIE.flatMap(s => s[1]);
const PAGINA = {
  "Yugi": "Yugi Muto", "Bakura": "Bakura", "Shark": "Reginald Kastle", "Crow": "Crow Hogan",
  "Leo/Luna": "Leo", "Quinton": "Quinton", "Ai": "Ai (character)", "Varis": "Varis",
  "Playmaker": "Yusaku Fujiki", "Blue Angel": "Aoi Zaizen", "Soulburner": "Takeru Homura",
  "Grandpa Muto": "Solomon Muto", "Gong Strong": "Gong Strong", "Shay": "Shay Obsidian"
};

/* colori delle cornici */
const CORNICE = {
  normal: ["Mostro normale", "#c9a86b"], effect: ["Mostro effetto", "#c47b3f"],
  ritual: ["Rituale", "#5a7fc4"], fusion: ["Fusione", "#8a5fb0"],
  synchro: ["Synchro", "#d8d4cc"], xyz: ["Xyz", "#2f2c38"],
  link: ["Link", "#2e6fa3"], spell: ["Magia", "#2e9b8f"], trap: ["Trappola", "#b8447f"],
  normal_pendulum: ["Pendulum", "#5fa87a"], effect_pendulum: ["Pendulum", "#5fa87a"],
  token: ["Token", "#8d8a96"], skill: ["Skill", "#8d8a96"]
};
const gruppo = f => (f || "").replace(/_pendulum$/, "_pendulum").replace(/^(xyz|synchro|fusion|ritual)_pendulum$/, "$1");

/* ============ archivio locale ============ */
const DB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open("lotd-le4", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    setTimeout(() => rej(new Error("timeout")), 4000);
  }));
  const tx = async (mode, fn) => {
    try {
      const db = await open();
      return await new Promise((res, rej) => {
        const q = fn(db.transaction("kv", mode).objectStore("kv"));
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
    } catch (e) { return null; }
  };
  return { get: k => tx("readonly", s => s.get(k)), set: (k, v) => tx("readwrite", s => s.put(v, k)) };
})();

/* ============ rete ============ */
async function testo(url, tempo = 25000) {
  const vie = [
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url),
    "https://corsproxy.io/?url=" + encodeURIComponent(url)
  ];
  for (const v of vie) {
    try {
      const c = new AbortController(), t = setTimeout(() => c.abort(), tempo);
      const r = await fetch(v, { signal: c.signal });
      clearTimeout(t);
      if (r.ok) { const s = await r.text(); if (s && s.length > 2000) return s; }
    } catch (e) {}
  }
  return null;
}
async function json(url, tempo = 15000) {
  try {
    const c = new AbortController(), t = setTimeout(() => c.abort(), tempo);
    const r = await fetch(url, { signal: c.signal });
    clearTimeout(t);
    if (r.ok) return await r.json();
  } catch (e) {}
  return null;
}

/* ============ liste carte ============ */
const GUIDA = "https://gamefaqs.gamespot.com/pc/280088-yu-gi-oh-legacy-of-the-duelist-link-evolution/faqs/79850";
const CARTE = new Map();   // nome busta -> [{n, r}]
const ID = new Map();      // nome carta -> {i: id, f: frameType}

function analizza(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const t = (doc.body ? doc.body.textContent : html).split(/\r?\n/);
  const out = new Map();
  let busta = null;
  for (let i = 0; i < t.length; i++) {
    const l = t[i].trim();
    if (/^={6,}$/.test(l) && /pack\s*$/i.test((t[i + 1] || "").trim()) && /^={6,}$/.test((t[i + 2] || "").trim())) {
      busta = t[i + 1].trim().replace(/\s+pack\s*$/i, "");
      if (!out.has(busta)) out.set(busta, []);
      i += 2;
      continue;
    }
    if (!busta) continue;
    const m = l.match(/^"(.+)"\s*(Rare)?$/i);
    if (m) out.get(busta).push({ n: m[1].trim(), r: m[2] ? "Rara" : "Comune" });
  }
  for (const [k, v] of [...out]) if (v.length < 5) out.delete(k);
  return out;
}

async function caricaListe() {
  const salvate = await DB.get("liste");
  if (salvate && salvate.length > 20) {
    for (const [k, v] of salvate) CARTE.set(k, v);
    return true;
  }
  const html = await testo(GUIDA);
  if (!html) return false;
  const mappa = analizza(html);
  if (mappa.size < 10) return false;
  for (const [k, v] of mappa) CARTE.set(k, v);
  DB.set("liste", [...mappa.entries()]);
  return true;
}

/* ============ immagini e tipo carta ============ */
const img = id => `https://images.ygoprodeck.com/images/cards_small/${id}.jpg`;
const imgGrande = id => `https://images.ygoprodeck.com/images/cards/${id}.jpg`;

async function risolviId(nomi) {
  const mancanti = [...new Set(nomi)].filter(n => !ID.has(n.toLowerCase()));
  if (!mancanti.length) return false;
  for (let i = 0; i < mancanti.length; i += 25) {
    const g = mancanti.slice(i, i + 25);
    const d = await json("https://db.ygoprodeck.com/api/v7/cardinfo.php?name=" + encodeURIComponent(g.join("|")));
    for (const c of (d?.data || []))
      ID.set(String(c.name).toLowerCase(), { i: c.card_images?.[0]?.id || c.id, f: c.frameType || "" });
    for (const n of g) if (!ID.has(n.toLowerCase())) ID.set(n.toLowerCase(), { i: 0, f: "" });
  }
  DB.set("id", [...ID.entries()]);
  return true;
}

/* ============ ritratti ============ */
const RITRATTO = new Map();
async function caricaRitratti() {
  const salvati = await DB.get("ritratti");
  if (salvati) { for (const [k, v] of salvati) RITRATTO.set(k, v); return; }
  const titoli = NOMI.map(n => PAGINA[n] || n);
  for (let i = 0; i < titoli.length; i += 20) {
    const d = await json("https://yugipedia.com/api.php?" + new URLSearchParams({
      action: "query", format: "json", formatversion: "2", origin: "*", redirects: "1",
      prop: "pageimages", piprop: "thumbnail", pithumbsize: "220",
      titles: titoli.slice(i, i + 20).join("|")
    }));
    for (const p of (d?.query?.pages || []))
      if (p.thumbnail?.source) RITRATTO.set(p.title, p.thumbnail.source);
  }
  DB.set("ritratti", [...RITRATTO.entries()]);
}
const ritrattoDi = n => RITRATTO.get(PAGINA[n] || n) || "";

/* ============ interfaccia ============ */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const iniziali = n => n.split(/[\s\/]+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
let tipiAttivi = new Set();

function ritrattoHTML(nome, cls = "ritratto") {
  const u = ritrattoDi(nome);
  return u ? `<img class="${cls}" src="${esc(u)}" alt="" loading="lazy">`
           : `<div class="${cls} iniziali">${esc(iniziali(nome))}</div>`;
}

function cartaHTML(c) {
  const d = ID.get(c.n.toLowerCase()) || {};
  const col = CORNICE[d.f]?.[1] || "transparent";
  return `<button class="carta" data-c="${esc(c.n)}">
    ${d.i ? `<img src="${img(d.i)}" alt="${esc(c.n)}" loading="lazy" decoding="async">`
          : `<div class="vuota">${esc(c.n)}</div>`}
    ${c.r === "Rara" ? `<i class="rara"></i>` : ""}
    <span class="n" style="border-left-color:${col}">${esc(c.n)}</span></button>`;
}

const intestazione = (t, conta, indietro) => `<header class="top"><div class="top-in">
  ${indietro ? `<button class="indietro" id="back" aria-label="Indietro">‹</button>` : ""}
  <h1 class="titolo">${esc(t)}</h1>
  ${conta ? `<span class="conta">${esc(conta)}</span>` : ""}</div></header>`;

function home(filtro = "") {
  const f = filtro.trim().toLowerCase();
  const totale = [...CARTE.values()].reduce((a, b) => a + b.length, 0);
  let corpo = "";
  for (const [serie, nomi] of SERIE) {
    const el = nomi.filter(n => !f || n.toLowerCase().includes(f));
    if (!el.length) continue;
    corpo += `<p class="serie">${esc(serie)}</p><div class="duellanti">` + el.map(n => {
      const lista = CARTE.get(n);
      return `<button class="duel" data-b="${esc(n)}">${ritrattoHTML(n)}
        <span style="min-width:0"><span class="nome">${esc(n)}</span>
        <small>${lista ? lista.length + " carte" : "lista non disponibile"}</small></span></button>`;
    }).join("") + `</div>`;
  }
  app.innerHTML = intestazione("Legacy of the Duelist: Link Evolution", totale ? totale + " carte" : "") + `
    <div class="wrap">
      <div class="tabs">
        <button class="tab" aria-selected="true" data-v="duellanti">Duellanti</button>
        <button class="tab" aria-selected="false" data-v="carte">Cerca una carta</button>
      </div>
      <input class="cerca" id="q" placeholder="Cerca un duellante" value="${esc(filtro)}">
      ${corpo || `<p class="vuoto">Nessun duellante con questo nome.</p>`}
    </div>`;
  legaRicerca(v => home(v));
}

function ricercaCarte(filtro = "") {
  const f = filtro.trim().toLowerCase();
  let corpo;
  if (!f) corpo = `<p class="vuoto">Scrivi il nome di una carta per vedere in quali buste si trova.</p>`;
  else {
    const trovate = new Map();
    for (const n of NOMI) for (const c of (CARTE.get(n) || []))
      if (c.n.toLowerCase().includes(f)) {
        if (!trovate.has(c.n)) trovate.set(c.n, []);
        trovate.get(c.n).push(n + (c.r === "Rara" ? " · rara" : ""));
      }
    const el = [...trovate.entries()].slice(0, 50);
    corpo = el.length ? el.map(([n, dove]) => {
      const d = ID.get(n.toLowerCase()) || {};
      return `<button class="ris" data-c="${esc(n)}">
        ${d.i ? `<img src="${img(d.i)}" alt="" loading="lazy">` : `<div class="vuota"></div>`}
        <span style="min-width:0"><span class="nome">${esc(n)}</span>
        <div>${dove.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div></span></button>`;
    }).join("") : `<p class="vuoto">Nessuna carta trovata.</p>`;
  }
  app.innerHTML = intestazione("Legacy of the Duelist: Link Evolution") + `
    <div class="wrap">
      <div class="tabs">
        <button class="tab" aria-selected="false" data-v="duellanti">Duellanti</button>
        <button class="tab" aria-selected="true" data-v="carte">Cerca una carta</button>
      </div>
      <input class="cerca" id="q" placeholder="Cerca una carta" value="${esc(filtro)}">
      ${corpo}
    </div>`;
  legaRicerca(v => ricercaCarte(v));
  if (f) {
    const nomi = [];
    for (const n of NOMI) for (const c of (CARTE.get(n) || []))
      if (c.n.toLowerCase().includes(f)) nomi.push(c.n);
    risolviId(nomi.slice(0, 50)).then(ok => ok && ricercaCarte(filtro));
  }
}

async function duellante(nome, filtro = "") {
  const lista = CARTE.get(nome) || [];
  const f = filtro.trim().toLowerCase();
  const presenti = [...new Set(lista.map(c => (ID.get(c.n.toLowerCase()) || {}).f).filter(Boolean))];
  const mostrate = lista.filter(c => {
    if (f && !c.n.toLowerCase().includes(f)) return false;
    if (!tipiAttivi.size) return true;
    return tipiAttivi.has((ID.get(c.n.toLowerCase()) || {}).f);
  });
  app.innerHTML = intestazione(nome, "", true) + `
    <div class="wrap">
      <div class="testa">${ritrattoHTML(nome)}<div><h2>${esc(nome)}</h2>
        <p>${lista.length ? `${lista.length} carte · ${lista.filter(c => c.r === "Rara").length} rare` : "lista non disponibile"}</p></div></div>
      ${lista.length ? `<input class="cerca" id="q" placeholder="Filtra queste carte" value="${esc(filtro)}">
      <div class="filtri">${presenti.map(t => `<button class="f" data-t="${esc(t)}" aria-pressed="${tipiAttivi.has(t)}">
        <i class="pallino" style="background:${CORNICE[t]?.[1] || "#777"}"></i>${esc(CORNICE[t]?.[0] || t)}</button>`).join("")}</div>
      <div class="carte">${mostrate.map(cartaHTML).join("")}</div>
      ${mostrate.length ? "" : `<p class="vuoto">Nessuna carta con questi filtri.</p>`}`
      : `<p class="vuoto">Non ho la lista di questa busta.</p>`}
    </div>`;
  document.getElementById("back").onclick = () => { tipiAttivi.clear(); home(); };
  legaRicerca(v => duellante(nome, v));
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    const t = b.dataset.t;
    tipiAttivi.has(t) ? tipiAttivi.delete(t) : tipiAttivi.add(t);
    duellante(nome, filtro);
  });
  if (lista.length && await risolviId(lista.map(c => c.n))) duellante(nome, filtro);
}

function legaRicerca(fn) {
  const q = document.getElementById("q");
  if (!q) return;
  q.oninput = () => {
    const v = q.value;
    clearTimeout(q._t);
    q._t = setTimeout(() => {
      fn(v);
      const n = document.getElementById("q");
      if (n) { n.focus(); n.setSelectionRange(v.length, v.length); }
    }, 250);
  };
}

function scheda(nome) {
  const d = ID.get(nome.toLowerCase()) || {};
  const dove = [];
  for (const n of NOMI) {
    const c = (CARTE.get(n) || []).find(x => x.n === nome);
    if (c) dove.push(n + (c.r === "Rara" ? " · rara" : ""));
  }
  const v = document.createElement("div");
  v.className = "velo";
  v.innerHTML = `<div class="scheda">
    ${d.i ? `<img src="${imgGrande(d.i)}" alt="${esc(nome)}">` : ""}
    <h3>${esc(nome)}</h3>
    ${d.f ? `<div class="meta">${esc(CORNICE[d.f]?.[0] || d.f)}</div>` : ""}
    ${dove.length ? `<div>${dove.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>` : ""}
    <button class="chiudi">Chiudi</button></div>`;
  v.onclick = () => v.remove();
  document.body.appendChild(v);
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-b]");
  if (b) { tipiAttivi.clear(); return duellante(b.dataset.b); }
  const c = e.target.closest("[data-c]");
  if (c) return scheda(c.dataset.c);
  const t = e.target.closest("[data-v]");
  if (t) return t.dataset.v === "carte" ? ricercaCarte() : home();
});

/* ============ avvio ============ */
async function avvia() {
  app.innerHTML = `<div class="boot"><h1>Carte per duellante</h1>
    <p class="sub">Legacy of the Duelist: Link Evolution</p>
    <div class="barra"><i style="width:30%"></i></div>
    <p class="caricando">Scarico le liste delle 33 buste</p></div>`;

  const salvati = await DB.get("id");
  if (salvati) for (const [k, v] of salvati) ID.set(k, v);

  const ok = await caricaListe();
  await caricaRitratti();

  if (!ok) {
    app.innerHTML = `<div class="boot"><h1>Liste non scaricate</h1>
      <p class="sub">La fonte delle liste carte non ha risposto. Riprova fra poco:
      i duellanti restano visibili, ma senza carte dentro.</p>
      <button class="azione" onclick="location.reload()">Riprova</button>
      <button class="azione second" id="cosi">Continua così</button></div>`;
    document.getElementById("cosi").onclick = () => home();
    return;
  }
  home();
}
avvia();
</script>
